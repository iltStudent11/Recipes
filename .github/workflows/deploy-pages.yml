name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # If your project is plain static files, this step is enough.
      # If you use a framework (React/Vite/Next/etc), replace with your real build steps.
      - name: Prepare static site
        run: |
          mkdir -p dist
          if [ -d "." ]; then
            cp -r . dist-temp
          fi
          # Example placeholder index if you don't already produce one:
          if [ ! -f dist/index.html ]; then
            cat > dist/index.html <<'EOF'
          <!doctype html>
          <html>
            <head><meta charset="utf-8"><title>Recipes</title></head>
            <body><h1>Recipes deployed with GitHub Pages</h1></body>
          </html>
          EOF
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Publish deploy URL in summary
        run: |
          echo "### 🚀 Deployment complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Site URL: ${{ steps.deployment.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
